<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="Halcyon — a living painting that tells the time and the weather.">
<title>Halcyon</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body class="loading">

<canvas id="scene" aria-hidden="true"></canvas>

<div id="fallback" hidden>
  <div class="fb-sky"></div>
  <div class="fb-hills fb-hills-far"></div>
  <div class="fb-hills fb-hills-near"></div>
  <div class="fb-water"></div>
</div>

<div id="vignette" hidden></div>

<main id="ui">
  <header class="bar">
    <div id="wordmark">Halcyon</div>
    <div class="bar-right">
      <button id="place-btn" type="button" aria-haspopup="dialog" aria-controls="settings">
        <span id="place-name">Locating…</span>
      </button>
      <button id="gear-btn" type="button" aria-haspopup="dialog" aria-controls="settings" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"></path>
        </svg>
      </button>
    </div>
  </header>

  <section id="clock-block" aria-label="Time">
    <div id="time" role="timer" aria-label="Current time"></div>
    <div id="seconds-line" aria-hidden="true"><span id="seconds-fill"></span></div>
    <div id="date-line"></div>
    <div id="phase-line"></div>
  </section>

  <div id="preview-label" hidden><span id="preview-time"></span> · Preview — double-click to return</div>

  <div id="timeline" role="slider" aria-label="Scrub time of day" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="0" tabindex="0">
    <div class="tl-track"></div>
    <div class="tl-ticks"></div>
    <div class="tl-marker" id="tl-marker"></div>
    <div class="tl-hover" id="tl-hover" hidden></div>
  </div>

  <aside id="settings" role="dialog" aria-modal="false" aria-label="Settings" aria-hidden="true"></aside>

  <div id="hud" hidden></div>
  <div id="key-hint" hidden></div>
  <div id="live" class="visually-hidden" role="status" aria-live="polite"></div>
</main>

<div id="fade" aria-hidden="true"></div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#eee;font-family:serif">Halcyon needs JavaScript.</p></noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
